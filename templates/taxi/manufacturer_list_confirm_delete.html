{% extends "base.html" %}
{% block content %}
  <h1>Delete Manufacturer List</h1>

  <p>Are you sure you want to delete the manufacturer list: {{ manufacturer_list }}?</p>
  <p><i>All manufacturers with this manufacturer list will be also deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
  </form>
{% endblock %}

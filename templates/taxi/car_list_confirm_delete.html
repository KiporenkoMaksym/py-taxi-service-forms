{% extends "base.html" %}
{% block content %}
  <h1>Delete Car List</h1>

  <p>Are you sure you want to delete the car list: {{ car_list }}?</p>
  <p><i>All cars with this car list will be also deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
  </form>
{% endblock %}
